<text x='40' y='562' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' fill='#8b949e' text-anchor='start' font-weight='400' dominant-baseline='middle' xml:space='preserve'>Each X is one butterfly: (a + W·b)/2 and (a − W·b)/2.  W⁰ = 1, W² = −j (free), W¹, W³ = √2/2·(±1 − j) (one constant multiply).</text>
<text x='40' y='588' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' fill='#8b949e' text-anchor='start' font-weight='400' dominant-baseline='middle' xml:space='preserve'>Inputs arrive in bit-reversed order (1 = 001 → 100 = 4); outputs come out in natural order.</text>
